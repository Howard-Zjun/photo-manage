# 应用名称
spring:
  application:
    name: personal-space
  thymeleaf:
    mode: HTML5
    prefix: classpath:/templates/
    cache: false
  datasource:
    url: jdbc:mysql://localhost:3306/photo-manage?serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
# 应用服务 WEB 访问端口
server:
  port: 8080
  servlet:
    context-path: /photomanage
mybatis:
  mapper-locations: classpath:dao/*.xml
  configuration:
    map-underscore-to-camel-case: true
#mongodb:
#  host: localhost # mongodb的连接地址
#  port: 27017 # mongodb的连接端口号
#  database: mall-port # mongodb的连接的数据库
pagehelper:
  reasonable: true
  support-methods-arguments: true
  params: count=countSql
  helper-dialect: mysql
