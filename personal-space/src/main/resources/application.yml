# 应用名称
spring:
  application:
    name: personal-space
  thymeleaf:
    mode: HTML5
    prefix: classpath:/templates/
    cache: false
  datasource:
    url: jdbc:mysql://localhost:3306/photo-manage?serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
  data:
    mongodb:
      host: localhost
      port: 27017
      username: admin
      password: admin
      database: photo-manage
      authentication-database: admin
  redis:
    port: 6379
    host: localhost
    database: 0
    lettuce:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 8
        min-idle: 0
    timeout: 1000
# 应用服务 WEB 访问端口
server:
  port: 8080
mybatis:
  mapper-locations: classpath:dao/*.xml
  configuration:
    map-underscore-to-camel-case: true
pagehelper:
  reasonable: true
  support-methods-arguments: true
  params: count=countSql
  helper-dialect: mysql
logging:
  level:
    com:
      jay:
        boot_zb03:
          dao: debug
