<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Photo Perfect</title>
    <meta content="Photo Perfect Template built with Bootstrap Framework for creating Photo Gallary"
          name="description"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Arimo:400,600,700">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/latest/css/font-awesome.min.css">
    <link type="image/png" rel="shortcut icon" href="../static/images/favicon.png" th:href="@{/images/favicon.png}">
    <link type="text/css" rel="stylesheet" href="../static/css/main.css" th:href="@{/css/main.css}">
    <link type="text/css" rel="stylesheet" href="../static/css/home.css" th:href="@{/css/home.css}">
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
</head>
<body id="top">
<div class="page" id="app">
    <header>
        <div class="pp-header">
            <nav class="navbar navbar-expand-lg navbar-light">
                <div class="container">
                    <a href="index.html" th:href="@{/index}">
                        <img src="../static/images/favicon.png" th:src="@{/images/favicon.png}">
                    </a>
                    <a class="navbar-brand" href="index.html" th:href="@{/index}">照片管理</a>
                    <button aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation"
                            class="navbar-toggler" data-target="#navbarNavAltMarkup" data-toggle="collapse"
                            type="button"><span class="navbar-toggler-icon"></span></button>
                    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                        <ul class="navbar-nav ml-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html" th:href="@{/index}">首页</a>
                            </li>
                            <li class="nav-item active">
                                <a class="nav-link" href="personal.html"
                                   th:href="@{/personal/index}">我的相册</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="manage-push.html"
                                   th:href="@{/manage/index}">管理</a>
                            </li>
                        </ul>
                    </div>
                    <div class="ydc-column-user" style="margin-left: 20px;">
                        <div class="ydc-user-photo">
                            <a href="javascript:;">
                                <img title="" about="" alt="" src="../static/images/photo.png"
                                     th:src="@{/images/photo.png}">
                            </a>
                        </div>
                        <div class="ydc-user-info">
                            <div class="ydc-user-info-name">
                                <a href="javascript:;">XXX</a>
                            </div>
                            <div class="ydc-user-info-func ydc-flex">
                                <span class="ydc-mal">
                                    <i class="ydc-icon ydc-icon-mail fl"></i>
                                    <em>12</em>
                                </span>
                                <a href="javascript:;">退出</a>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </header>
    <div class="page-content">
        <div class="container">
            <div class="container pp-section">
                <div class="row">
                    <div class="col-md-9 col-sm-12 px-0">
                        <h1 class="h3">个人相册总览</h1>
                    </div>
                </div>
            </div>
            <div class="container px-0 py-4">
                <div class="pp-category-filter">
                    <div class="row">
                        <div class="col-sm-12">
                            <a class="btn pp-filter-button" th:each="tag :${tags}" th:text="${tag}" data-filter="All"
                               th:attr="data-filter=${tag}"
                               th:attrappend="class=${tagStat.first}? ' btn-primary' : ' btn-outline-primary'">All</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container px-0">
                <div class="pp-gallery">
                    <div class="card-columns">
                        <div class="card" th:each="item:${previewItems}" data-groups="[&quot;nature&quot;]"
                             th:attr="data-groups=${'[' + item.tags + ']'}">
                            <a href="detail.html" th:href="@{/detail/index (shareId = ${item.shareId})}">
                                <figure class="pp-effect">
                                    <img alt="img" class="img-fluid" src="../static/images/1-nature.jpg"
                                         th:src="@{/resource/image (id = ${item.photoPath})}"/>
                                    <figcaption>
                                        <div class="h4">Forest</div>
                                        <p th:each="tag:${item.splitTags()}" th:text="${tag}">Nature</p>
                                    </figcaption>
                                </figure>
                            </a>
                            <el-button type="primary" th:@click="|loadTag(${item.shareId})|">标签管理</el-button>
                            <el-button type="danger" icon="el-icon-delete" th:@click="|deleteShare(${item.shareId})|">删除</el-button>
                        </div>
                        <el-dialog title="权限设置" :visible.sync="dialogTableVisible" v-loading="loading">
                            <el-transfer
                                    v-model="value"
                                    :data="data">
                            </el-transfer>
                            <el-button type="success" th:v-on:click="confirmTag">确定</el-button>
                        </el-dialog>
                    </div>
                </div>
            </div>
            <div class="pp-section"></div>
        </div>
    </div>
    <footer class="pp-footer">
        <div class="container py-5">
            <div class="row text-center">
                <div class="col-md-12"><a class="pp-facebook btn btn-link" href="#"><i aria-hidden="true"
                                                                                       class="fa fa-facebook fa-2x "></i></a><a
                        class="pp-twitter btn btn-link " href="#"><i aria-hidden="true"
                                                                     class="fa fa-twitter fa-2x "></i></a><a
                        class="pp-google-plus btn btn-link" href="#"><i aria-hidden="true"
                                                                        class="fa fa-google-plus fa-2x"></i></a><a
                        class="pp-instagram btn btn-link" href="#"><i aria-hidden="true"
                                                                      class="fa fa-instagram fa-2x "></i></a></div>
            </div>
        </div>
    </footer>
</div>
<!-- import Vue before Element -->
<script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
<!-- import JavaScript -->
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script th:src="@{/js/local.js}"></script>
<script>
    function generateData() {
        const data = [];
        const cities = ['x', 'xx', 'xxx'];
        const pinyin = ['x', 'x', 'x'];
        cities.forEach((city, index) => {
            data.push({
                label: city,
                key: index,
                pinyin: pinyin[index]
            });
        });
        return data;
    }
    let app = new Vue({
        el: '#app',
        data: {
            dialogTableVisible: false,
            sourceData: [],
            value:[],
            data: generateData(),
            nowShareId: "",
            loading: false
        },
        methods: {
            loadTag: function (shareId) {
                this.loading = true;
                this.dialogTableVisible = true;
                $.ajax({
                    url: "/personal/tag?shareId=" + shareId + "&userId=" + getCookie("userId"),
                    type: "get",
                    success: function (object) {
                        const useTagArr = object.useTag;
                        const noUseTagArr = object.noUseTag;
                        const data = [];
                        const value = [];
                        for (let i = 0; i < noUseTagArr.length; i++) {
                            value.push(i);
                        }
                        const tagArr = noUseTagArr.concat(useTagArr);
                        console.log(tagArr);
                        tagArr.forEach((tag, index) => {
                            data.push({
                                label: tag.name,
                                key: index
                            });
                        });
                        app.nowShareId = shareId;
                        app.sourceData = tagArr;
                        app.data = data;
                        app.value = value;
                        app.loading = false;
                    },
                    error: function () {
                        app.loading = false;
                        this.$message.error('错了哦，这是一条错误消息');
                    }
                })
            },
            confirmTag: function () {
                var ids = [];
                this.data.forEach((tag, index) => {
                    if (this.value.indexOf(index) == -1) {
                        ids.push(this.sourceData[index].tagId);
                    }
                })
                const data = JSON.stringify({
                    "shareId": this.nowShareId,
                    "tagIds": ids
                });
                $.ajax({
                    url: "/personal/confirm",
                    type: "post",
                    contentType: "application/json",
                    data: data,
                    success: function () {
                        // app.dialogTableVisible = false;
                        location.reload();
                    }
                });
            },
            deleteShare: function (shareId) {
                const data = JSON.stringify({
                    "shareId" : shareId
                });
                $.ajax({
                    url: "/personal/delete",
                    type: "post",
                    contentType: "application/json",
                    data: data,
                    success: function () {
                        location.reload();
                    }
                });
            }
        }
    })
</script>
<script src="https://code.jquery.com/jquery-3.2.1.min.js" th:src="@{https://code.jquery.com/jquery-3.2.1.min.js}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" th:src="@{https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js}"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" th:src="@{https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js}"></script>
<script src="../static/js/main.js" th:src="@{/js/main.js}"></script>
